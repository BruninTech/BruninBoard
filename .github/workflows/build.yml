name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: brew install xcodegen ldid
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project BruninBoard.xcodeproj -scheme BruninBoard \
            -configuration Release -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Package IPA with pseudo-signed entitlements
        run: |
          APP=build/Build/Products/Release-iphoneos/BruninBoard.app
          ldid -SApp/BruninBoard.entitlements "$APP/BruninBoard"
          ldid -SKeyboard/BruninBoardKeyboard.entitlements "$APP/PlugIns/BruninBoardKeyboard.appex/BruninBoardKeyboard"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qr BruninBoard.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: BruninBoard-ipa
          path: BruninBoard.ipa
